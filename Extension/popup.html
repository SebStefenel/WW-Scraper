<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #1a1a1a;
        --muted: #6b6b6b;
        --line: #e0e0e0;
        --accent: #ffcc00;
        --accent-ink: #1a1a1a;
        --panel: #f7f7f7;
        --ok: #1a7f37;
        --err: #b4232c;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1b1b1b;
          --fg: #ececec;
          --muted: #9a9a9a;
          --line: #333;
          --panel: #242424;
          --ok: #4ac26b;
          --err: #f06a70;
        }
      }
      * { box-sizing: border-box; }
      body {
        width: 420px;
        margin: 0;
        padding: 12px;
        font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--fg);
      }
      h1 { font-size: 14px; margin: 0 0 2px; }
      .titlebar { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
      .titlebar button { font-size: 11px; padding: 3px 7px; }
      .sub { color: var(--muted); font-size: 11px; margin-bottom: 10px; }
      body.in-tab { width: 560px; margin: 26px auto; }
      body.in-tab #openTab { display: none; }
      fieldset {
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 9px 10px 11px;
        margin: 0 0 9px;
        background: var(--panel);
      }
      legend { font-size: 11px; font-weight: 600; letter-spacing: .03em; text-transform: uppercase; color: var(--muted); padding: 0 4px; }
      button {
        font: inherit;
        font-size: 12px;
        padding: 5px 10px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--bg);
        color: var(--fg);
        cursor: pointer;
      }
      button:hover:not(:disabled) { border-color: var(--muted); }
      button:disabled { opacity: .45; cursor: default; }
      button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
      .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
      .row + .row { margin-top: 7px; }
      label.inline { font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; gap: 4px; }
      input[type="number"] { width: 62px; font: inherit; font-size: 12px; padding: 3px 5px; border: 1px solid var(--line); border-radius: 5px; background: var(--bg); color: var(--fg); }
      textarea { width: 100%; height: 46px; font: 11px/1.4 ui-monospace, Menlo, monospace; padding: 5px; border: 1px solid var(--line); border-radius: 5px; background: var(--bg); color: var(--fg); resize: vertical; }
      #status { font-size: 12px; margin-bottom: 9px; padding: 6px 8px; border-radius: 6px; background: var(--panel); border: 1px solid var(--line); }
      #status b { font-variant-numeric: tabular-nums; }
      #events { max-height: 190px; overflow-y: auto; margin-top: 7px; }
      .ev { border: 1px solid var(--line); border-radius: 6px; padding: 5px 7px; margin-bottom: 5px; background: var(--bg); }
      .ev .m { font: 11px ui-monospace, Menlo, monospace; word-break: break-all; color: var(--fg); }
      .ev .meta { font-size: 10px; color: var(--muted); margin-top: 2px; }
      .ev button { margin-top: 5px; font-size: 11px; padding: 3px 7px; }
      #log { font: 11px/1.5 ui-monospace, Menlo, monospace; color: var(--muted); max-height: 78px; overflow-y: auto; white-space: pre-wrap; margin-top: 8px; border-top: 1px solid var(--line); padding-top: 6px; }
      .ok { color: var(--ok); }
      .err { color: var(--err); }
      .hint { font-size: 11px; color: var(--muted); margin-top: 6px; }
    </style>
  </head>
  <body>
    <div class="titlebar">
      <h1>WaterlooWorks Scraper</h1>
      <button id="openTab" title="Open this panel in a full tab">Open in tab ⇱</button>
    </div>
    <div class="sub">Runs inside your logged-in session. No credentials are stored or sent anywhere.</div>

    <div id="status">Checking tab…</div>

    <fieldset>
      <legend>1 · Learn the posting request</legend>
      <div class="row">
        <button id="learnStart" class="primary">Start learning</button>
        <button id="learnStop">Stop</button>
        <label class="inline"><input type="checkbox" id="showAll" /> show all requests</label>
      </div>
      <div class="row">
        <button id="usePage">Use current page as template</button>
        <span class="hint">if opening a posting just changed the URL</span>
      </div>
      <div id="events"></div>
    </fieldset>

    <fieldset>
      <legend>2 · Collect posting IDs</legend>
      <div class="row">
        <button id="scanPage">Scan this page</button>
        <button id="paginate">Scan + follow pages</button>
        <label class="inline">max <input type="number" id="maxPages" value="40" min="1" max="500" /></label>
        <button id="idsClear">Clear</button>
      </div>
      <div class="row">
        <textarea id="manualIds" placeholder="…or paste posting IDs here (any separator)"></textarea>
      </div>
      <div class="row">
        <button id="idsManual">Add pasted IDs</button>
        <button id="dumpList">Dump list DOM</button>
      </div>
    </fieldset>

    <fieldset>
      <legend>3 · Scrape details</legend>
      <div class="row">
        <button id="scrapeStart" class="primary">Start scrape</button>
        <button id="scrapeStop">Stop</button>
        <label class="inline">delay <input type="number" id="delayMs" value="1500" min="300" step="100" /> ms</label>
      </div>
      <div class="row">
        <label class="inline"><input type="checkbox" id="rawHtml" /> keep raw HTML</label>
        <label class="inline"><input type="checkbox" id="skipExisting" checked /> skip already-scraped</label>
      </div>
    </fieldset>

    <fieldset>
      <legend>4 · Output</legend>
      <div class="row">
        <button id="chooseFolder">Choose folder…</button>
        <button id="clearFolder">Reset</button>
        <span class="hint">→ <span id="folderName">none</span></span>
      </div>
      <div class="row">
        <button id="save" class="primary">Save JSON</button>
        <button id="dump">Dump one raw posting</button>
        <button id="resultsClear">Clear results</button>
      </div>
      <div class="row">
        <label class="inline"><input type="checkbox" id="autoSave" checked /> auto-save when a scrape finishes</label>
      </div>
    </fieldset>

    <div id="log"></div>
    <script src="popup.js"></script>
  </body>
</html>
